<!doctype html>
<html><head><meta charset="utf-8"><title>redirect.test</title></head>
<body>
  <h1>redirect language-picker self-test</h1>
  <pre id="out">Running…</pre>
  <script>
    var out = document.getElementById('out');
    function assert(cond, msg) { if (!cond) throw new Error('FAIL: ' + msg); }

    function pick(storedLang, browserLangs) {
      var SUPPORTED = ['de', 'en', 'es'];
      if (storedLang && SUPPORTED.indexOf(storedLang) !== -1) return storedLang;
      if (browserLangs) {
        for (var i = 0; i < browserLangs.length; i++) {
          var code = String(browserLangs[i]).slice(0, 2).toLowerCase();
          if (SUPPORTED.indexOf(code) !== -1) return code;
        }
      }
      return 'de';
    }

    try {
      assert(pick('es', ['de-DE']) === 'es', 'stored ES wins over browser DE');
      assert(pick(null, ['en-US','de-DE']) === 'en', 'first supported browser lang wins');
      assert(pick(null, ['fr-FR','es-AR','de-DE']) === 'es', 'skips unsupported FR, picks ES');
      assert(pick(null, ['fr-FR','ja-JP']) === 'de', 'no supported → fallback DE');
      assert(pick('fr', ['en-US']) === 'en', 'invalid stored ignored, browser wins');
      assert(pick(null, null) === 'de', 'no signals → DE');
      assert(pick(null, []) === 'de', 'empty browser langs → DE');
      assert(pick('DE', ['en-US']) === 'en', 'uppercase stored not matched (must be lowercase)');

      out.textContent = 'PASS — all 8 assertions ok';
      out.style.color = 'green';
    } catch (err) {
      out.textContent = err.message;
      out.style.color = 'red';
    }
  </script>
</body>
</html>
