<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>nav.js test</title></head>
<body>
  <h1>nav.js self-test</h1>
  <pre id="out">Running…</pre>
  <script>
    var out = document.getElementById('out');
    function assert(cond, msg) { if (!cond) throw new Error('FAIL: ' + msg); }

    try {
      // Test 1: persistence writes localStorage.mm_lang when html[lang] is valid.
      localStorage.removeItem('mm_lang');
      document.documentElement.lang = 'de';
      (function () {
        var lang = document.documentElement.lang;
        if (lang && /^(de|en|es)$/i.test(lang)) {
          localStorage.setItem('mm_lang', lang.toLowerCase());
        }
      })();
      assert(localStorage.getItem('mm_lang') === 'de', 'persists "de"');

      // Test 2: uppercase input is normalised to lowercase.
      localStorage.removeItem('mm_lang');
      document.documentElement.lang = 'EN';
      (function () {
        var lang = document.documentElement.lang;
        if (lang && /^(de|en|es)$/i.test(lang)) {
          localStorage.setItem('mm_lang', lang.toLowerCase());
        }
      })();
      assert(localStorage.getItem('mm_lang') === 'en', 'normalises "EN" → "en"');

      // Test 3: unknown lang code is NOT written.
      localStorage.removeItem('mm_lang');
      document.documentElement.lang = 'fr';
      (function () {
        var lang = document.documentElement.lang;
        if (lang && /^(de|en|es)$/i.test(lang)) {
          localStorage.setItem('mm_lang', lang.toLowerCase());
        }
      })();
      assert(localStorage.getItem('mm_lang') === null, 'skips unsupported "fr"');

      out.textContent = 'PASS — all 3 assertions ok';
      out.style.color = 'green';
    } catch (err) {
      out.textContent = err.message;
      out.style.color = 'red';
    }
  </script>
</body>
</html>
